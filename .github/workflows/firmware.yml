name: Build ReSpeaker firmware

on:
  push:
    branches: [main, feature/wakeword-false-positives, feature/network-config]
    paths:
      - 'respeaker.yaml'
      - 'components/**'
      - 'sounds/**'
      - '*.tflite'
      - '*.json'
      - 'version.txt'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install ESPHome
        run: python -m pip install esphome
      - name: Prepare secrets
        env:
          API_KEY: ${{ secrets.ESPHOME_API_ENCRYPTION_KEY }}
          WIFI_SSID: ${{ secrets.ESPHOME_WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.ESPHOME_WIFI_PASSWORD }}
          WIFI_AP_SSID: ${{ secrets.ESPHOME_WIFI_AP_SSID }}
          WIFI_AP_PASSWORD: ${{ secrets.ESPHOME_WIFI_AP_PASSWORD }}
          SERVER_HOST: ${{ secrets.AMBROSIERVER_HOST }}
        run: |
          python - <<'PY'
          import os, pathlib, json
          names = {
              "api_encryption_key": "API_KEY",
              "wifi_ssid": "WIFI_SSID",
              "wifi_password": "WIFI_PASSWORD",
              "wifi_ap_ssid": "WIFI_AP_SSID",
              "wifi_ap_password": "WIFI_AP_PASSWORD",
              "ambrosierver_host": "SERVER_HOST",
          }
          missing = [key for key, env in names.items() if not os.getenv(env)]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
          # JSON string literals are valid YAML scalars and preserve special characters.
          pathlib.Path("secrets.yaml").write_text(
              "".join(f"{key}: {json.dumps(os.environ[env])}\n" for key, env in names.items()),
              encoding="utf-8",
          )
          PY
      - name: Choose next stable firmware version
        if: github.ref == 'refs/heads/main'
        id: stable_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          releases = json.loads(subprocess.check_output(['gh', 'release', 'list', '--json', 'tagName', '--limit', '100'], text=True))
          versions = [int(m.group(1)) for r in releases if (m := re.fullmatch(r'v1\.0\.(\d+)', r['tagName']))]
          exists_base = any(r['tagName'] == 'v1.0' for r in releases)
          version = 'v1.0' if not exists_base and not versions else f'v1.0.{max(versions, default=0) + 1}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\n')
          print('Publishing firmware', version)
          PY
      - name: Set firmware version
        env:
          RELEASE_VERSION: ${{ steps.stable_version.outputs.version }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          version = os.environ.get('RELEASE_VERSION') or Path('version.txt').read_text().strip()
          if not __import__('re').fullmatch(r'v[0-9]+(?:\.[0-9]+)*', version):
              raise SystemExit('Invalid firmware version')
          cfg = Path('respeaker.yaml')
          source = cfg.read_text()
          import re
          source, count = re.subn(r"firmware_version: 'v[0-9]+(?:\.[0-9]+)*'", f"firmware_version: '{version}'", source, count=1)
          if count != 1:
              raise SystemExit('Firmware version declaration not found')
          cfg.write_text(source)
          PY
      - name: Build stable firmware
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          python -m esphome compile respeaker.yaml
          BIN="$(find .esphome/build -type f -name firmware.ota.bin -print -quit)"
          if [ -z "$BIN" ]; then BIN="$(find .esphome/build -type f -name firmware.bin -print -quit)"; fi
          test -n "$BIN"
          mkdir -p dist
          cp "$BIN" dist/ambrosio-respeaker-ota.bin
          (cd dist && sha256sum ambrosio-respeaker-ota.bin > sha256sum.txt)
          printf '{"commit":"%s","workflow_run":"%s","source":"respeaker.yaml","variant":"custom"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/firmware.json
      - name: Compile firmware
        if: github.ref != 'refs/heads/main'
        run: python -m esphome compile respeaker.yaml
      - name: Package OTA image
        if: github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p dist
          echo "Firmware binaries generated:"
          find .esphome/build -type f \( -name '*.bin' -o -name '*.ota.bin' \) -print
          # ESPHome ESP-IDF generates firmware.ota.bin for OTA updates.
          BIN="$(find .esphome/build -type f -name firmware.ota.bin -print -quit)"
          if [ -z "$BIN" ]; then
            BIN="$(find .esphome/build -type f -name firmware.bin -print -quit)"
          fi
          if [ -z "$BIN" ]; then
            echo "::error::No OTA firmware found in .esphome/build"
            exit 1
          fi
          echo "Packaging OTA firmware: $BIN"
          cp "$BIN" dist/ambrosio-respeaker-ota.bin
          sha256sum dist/ambrosio-respeaker-ota.bin > dist/sha256sum.txt
          printf '{"commit":"%s","workflow_run":"%s","source":"respeaker.yaml"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/firmware.json
      - name: Upload firmware artifact
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: ambrosio-respeaker-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Publish stable firmware
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.stable_version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::notice::Release $VERSION already exists; not overwriting."
            exit 0
          fi
          gh release create "$VERSION" \
            dist/ambrosio-respeaker-ota.bin \
            dist/sha256sum.txt \
            dist/firmware.json \
            --target "$GITHUB_SHA" \
            --title "Ambrosio firmware $VERSION" \
            --notes "Firmware OTA compilado desde respeaker.yaml, commit $GITHUB_SHA."
      - name: Publish experimental GitHub prerelease
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < version.txt)"
          TAG="test-${VERSION}-${GITHUB_SHA:0:7}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Prerelease $TAG already exists; not overwriting."
            exit 0
          fi
          gh release create "$TAG" \
            dist/ambrosio-respeaker-ota.bin \
            dist/sha256sum.txt \
            dist/firmware.json \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Ambrosio experimental $TAG" \
            --notes "Firmware experimental OTA compilado desde $GITHUB_SHA."
