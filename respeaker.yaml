# ─────────────────────────────────────────────────────────────────────────────
# Ambrosio Satélite — ReSpeaker XVF3800 (XMOS) + XIAO ESP32S3.
#
# Firmware XMOS 1.0.7 I2S-MASTER (se graba solo por I2C en el arranque); el ESP
# va como i2s secondary. Wake word "oye ambrosio" → audio_streamer manda el audio
# al Ambrosierver por TCP. Reproduce/para música sin colgar el micro.
#
# Base hardware (firmware/i2s/DAC) de github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration
# El config previo (firmware 1.0.5, ESP master) queda en respeaker-old.yaml.
# ─────────────────────────────────────────────────────────────────────────────

substitutions:
  firmware_version: 'v1.2'

esphome:
  name: ambrosio
  name_add_mac_suffix: true
  includes:
    - components/ambrosio_network.h
  on_boot:
    priority: -100
    then:
      - delay: 1s
      - lambda: |-
          id(streamer).set_name(id(satellite_name).state);
          id(streamer).set_host(id(server_host).state);
      - lambda: |-
          // Pending changes from a previous boot must never be confirmed implicitly.
          ambrosio_network::write("pending", "0");
      - micro_wake_word.start:

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    version: recommended
    components:
      - espressif/esp-nn==1.1.2  # acelera micro_wake_word en S3
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s
  # Cambios IPv4 experimentales, con rollback tras 120 segundos sin confirmación.
  services:
    - service: configure_network
      variables:
        mode: string
        ip: string
        mask: string
        gateway: string
        dns: string
      then:
        - lambda: |-
            ESP_LOGI("ambrosio_net", "Network change requested: mode=%s", mode.c_str());
            if (ambrosio_network::stage(mode, ip, mask, gateway, dns)) {
              id(network_pending_since) = millis();
              id(network_pending) = true;
              ESP_LOGI("ambrosio_net", "Network change staged: mode=%s, pending=%s", mode.c_str(), ambrosio_network::read("pending").c_str());
            } else {
              ESP_LOGE("ambrosio_net", "Network change staging failed: mode=%s, pending=%s", mode.c_str(), ambrosio_network::read("pending").c_str());
            }
    - service: confirm_network
      then:
        - lambda: |-
            if (id(network_pending)) {
              const auto candidate = ambrosio_network::read("candidate");
              if (candidate.rfind("dhcp|", 0) == 0 && !ambrosio_network::dhcp_ready()) {
                ESP_LOGW("ambrosio_net", "DHCP confirmation deferred: no valid DHCP lease yet");
                ambrosio_network::log_dhcp_state();
              } else {
                ESP_LOGI("ambrosio_net", "Network confirmation received over encrypted ESPHome API");
                ambrosio_network::confirm();
                if (ambrosio_network::read("pending") == "0") id(network_pending) = false;
              }
            } else {
              ESP_LOGW("ambrosio_net", "Network confirmation ignored: no pending change");
            }
    # Cambio de red Wi-Fi desde Ambrosierver. Si en 30 s no conecta a la nueva,
    # wifi.configure vuelve sola a la anterior (contraseña mal escrita, etc.).
    - service: configure_wifi
      variables:
        ssid: string
        password: string
      then:
        - logger.log:
            format: "Wi-Fi change requested: ssid=%s"
            args: [ssid.c_str()]
        - wifi.configure:
            ssid: !lambda 'return ssid;'
            password: !lambda 'return password;'
            save: true
            timeout: 30s
            on_connect:
              - logger.log: "Wi-Fi change applied"
            on_error:
              - logger.log:
                  level: WARN
                  format: "Wi-Fi change failed; restored previous network"
    # Escaneo bajo demanda para que Ambrosierver ofrezca la lista de redes.
    # El resultado llega por el text_sensor "WiFi Scan Results".
    - service: scan_wifi
      then:
        - lambda: |-
            if (!ambrosio_network::start_wifi_scan())
              ESP_LOGW("ambrosio_net", "Wi-Fi scan could not be started");
  # Servicios que llama Ambrosierver para el feedback de color del anillo LED.
    - service: set_led_color
      variables:
        red: int
        green: int
        blue: int
      then:
        - lambda: 'id(led_hold_until) = millis() + 3000; id(led_r) = red; id(led_g) = green; id(led_b) = blue;'
        - script.execute: led_solid
    - service: leds_off
      then:
        - lambda: 'id(led_hold_until) = millis() + 3000;'
        - script.execute: led_off
    - service: blink_color
      variables:
        red: int
        green: int
        blue: int
        count: int
      then:
        - lambda: 'id(led_hold_until) = millis() + 3000; id(led_r) = red; id(led_g) = green; id(led_b) = blue; id(led_blink_count) = count;'
        - script.execute: led_blink

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  on_connect:
    then:
      - delay: 1s
      - lambda: |-
          // Apply persisted IPv4 only after ESPHome finishes connecting Wi-Fi.
          // Never override an in-progress staged change.
          if (!id(network_pending)) {
            ambrosio_network::restore_confirmed();
          }
  ap:
    ssid: !secret wifi_ap_ssid
    password: !secret wifi_ap_password

captive_portal:

web_server:
  port: 80
  version: 3
  css_include: ambrosio-web.css

http_request:
  timeout: 3s

interval:
  - interval: 5s
    then:
      - lambda: |-
          if (id(network_pending) && ambrosio_network::read("candidate").rfind("dhcp|", 0) == 0) {
            ambrosio_network::log_dhcp_state();
          }
          if (id(network_pending) && (uint32_t)(millis() - id(network_pending_since)) > 120000) {
            ESP_LOGW("ambrosio_net", "Network configuration timed out; restoring last confirmed settings");
            ambrosio_network::restore_confirmed();
            ambrosio_network::write("pending", "0");
            id(network_pending) = false;
          }
  - interval: 10s
    then:
      - http_request.get:
          url: !lambda 'return "http://" + id(server_host).state + ":8090/health";'
          on_response:
            then:
              - lambda: 'id(server_online) = (response->status_code == 200);'
          on_error:
            then:
              - lambda: 'id(server_online) = false;'
  - interval: 150ms
    then:
      - lambda: |-
          uint32_t now = millis();
          const bool idle = !id(streaming_audio) && (int32_t)(now - id(led_hold_until)) >= 0;
          if (!id(server_online) && idle) {
            uint32_t phase = now % 1600;
            uint8_t b = 0;
            if (phase < 180) b = phase < 90 ? phase * 150 / 90 : (180 - phase) * 150 / 90;
            else if (phase >= 270 && phase < 450) b = phase < 360 ? (phase - 270) * 150 / 90 : (450 - phase) * 150 / 90;
            uint32_t colors[12];
            for (int i = 0; i < 12; i++) colors[i] = (uint32_t) b << 16;
            id(respeaker).set_led_ring(colors);
            id(heartbeat_visible) = true;
            id(mute_visible) = false;
          } else if (id(mic_mute_switch).state && idle) {
            // Micro silenciado: rojo fijo tenue (el latido rojo es "sin servidor").
            if (!id(mute_visible)) {
              uint32_t colors[12];
              for (int i = 0; i < 12; i++) colors[i] = (uint32_t) 40 << 16;
              id(respeaker).set_led_ring(colors);
              id(mute_visible) = true;
            }
            id(heartbeat_visible) = false;
          } else if (id(heartbeat_visible) || (id(mute_visible) && !id(mic_mute_switch).state)) {
            uint32_t colors[12] = {0};
            id(respeaker).set_led_ring(colors);
            id(heartbeat_visible) = false;
            id(mute_visible) = false;
          }

# ── Control del anillo LED (12 SK6812) vía el XMOS (set_led_ring del componente) ──
globals:
  - id: network_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: network_pending_since
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: server_online
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: streaming_audio
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: heartbeat_visible
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: mute_visible
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: led_hold_until
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: led_r
    type: int
    restore_value: no
    initial_value: '0'
  - id: led_g
    type: int
    restore_value: no
    initial_value: '0'
  - id: led_b
    type: int
    restore_value: no
    initial_value: '0'
  - id: led_blink_count
    type: int
    restore_value: no
    initial_value: '2'

script:
  - id: led_solid
    then:
      - lambda: |-
          uint32_t c = ((uint32_t) id(led_r) << 16) | ((uint32_t) id(led_g) << 8) | (uint32_t) id(led_b);
          uint32_t colors[12];
          for (int i = 0; i < 12; i++) colors[i] = c;
          id(respeaker).set_led_ring(colors);
  - id: led_off
    then:
      - lambda: |-
          uint32_t colors[12] = {0};
          id(respeaker).set_led_ring(colors);
  - id: led_blink
    mode: restart
    then:
      - repeat:
          count: !lambda 'return id(led_blink_count) > 0 ? id(led_blink_count) : 2;'
          then:
            - script.execute: led_solid
            - delay: 250ms
            - script.execute: led_off
            - delay: 200ms

# ── I2C: control del XMOS (0x2C) y del DAC AIC3104 (0x18) ──
i2c:
  - id: bus_a
    sda: GPIO5
    scl: GPIO6
    scan: true
    frequency: 100kHz

# ── Componentes externos: fork de i2s_audio (para mic 48k→mWW) + control XMOS + DAC ──
external_components:
  - source:
      type: git
      url: https://github.com/formatBCE/esphome
      ref: respeaker_microphone
    components: [i2s_audio]
    refresh: 0s
  - source:
      type: git
      url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration
      ref: main
    components: [respeaker_xvf3800, aic3104]
    refresh: 0s
  - source:
      type: local
      path: components
    components: [audio_streamer]

# Streamer custom: tras la wakeword, abre TCP al Ambrosierver y manda el audio
# del micro (convertido a 16k/16bit/mono en el componente). Cierra por silencio.
audio_streamer:
  id: streamer
  microphone: i2s_mics
  host: !secret ambrosierver_host
  port: 9000
  silence_threshold: 300
  silence_duration: 1500ms
  min_duration: 500ms
  max_duration: 4s
  on_start:
    - lambda: 'id(streaming_audio) = true;'
    - logger.log: "STREAM: started"
  on_end:
    - lambda: 'id(streaming_audio) = false; id(led_hold_until) = millis() + 1200;'
    - logger.log: "STREAM: ended (silence)"
    - script.execute: led_off   # el server pintará el color del resultado (verde/naranja)
    - delay: 300ms
    - micro_wake_word.start:
  on_error:
    - lambda: 'id(streaming_audio) = false; id(led_hold_until) = millis() + 1200;'
    - logger.log: "STREAM: error"
    - lambda: 'id(led_r) = 220; id(led_g) = 0; id(led_b) = 0; id(led_blink_count) = 2;'
    - script.execute: led_blink
    - delay: 500ms
    - micro_wake_word.start:

# Nombre del satélite (se manda al server como identificador/área) y host del
# Ambrosierver. Persisten en flash; el server puede reescribir el host por API.
text_sensor:
  - platform: template
    name: 'Ambrosio Network Configuration'
    id: ambrosio_network_configuration
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return ambrosio_network::read("confirmed", "dhcp||||");
  # Red Wi-Fi actual, para mostrarla en Ambrosierver.
  - platform: wifi_info
    ssid:
      name: 'WiFi SSID'
      entity_category: diagnostic
    # Redes visibles ("SSID: -XXdB" por línea), para elegir red en Ambrosierver.
    scan_results:
      name: 'WiFi Scan Results'
  - platform: template
    name: 'Firmware Ambrosio'
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return {"${firmware_version}"};

text:
  - platform: template
    name: "Nombre del Ambrosio"
    id: satellite_name
    optimistic: true
    min_length: 1
    max_length: 32
    mode: text
    initial_value: "sin_asignar"
    restore_value: true
    on_value:
      then:
        - lambda: 'id(streamer).set_name(x);'
  - platform: template
    name: "Servidor Host"
    id: server_host
    optimistic: true
    min_length: 1
    max_length: 64
    mode: text
    initial_value: !secret ambrosierver_host
    restore_value: true
    on_value:
      then:
        - lambda: 'id(streamer).set_host(x);'

# ── XMOS XVF3800: graba el firmware 1.0.7 (I2S master) por I2C en el arranque ──
respeaker_xvf3800:
  id: respeaker
  address: 0x2C
  i2c_id: bus_a
  # El XMOS arranca con el micro MUTEADO; el switch (restore OFF) lo desmutea en
  # el arranque vía GPO. Sin esto, el micro está mudo y mWW no detecta nada.
  mute_switch:
    id: mic_mute_switch
    name: "Microphone Mute"
    update_interval: 1s
  dfu_version:
    name: "XMOS Firmware Version"
  # El firmware XMOS 1.0.7 ya está instalado en el DSP. No descargar un binario
  # externo durante la compilación; la actualización XMOS se gestiona por separado.

# ── DAC del speaker (chip AIC3104 en 0x18) ──
audio_dac:
  - platform: aic3104
    id: aic3104_dac
    i2c_id: bus_a

# ── I2S: el XMOS es el MASTER (genera reloj); el ESP va como secondary. ──
# Entrada y salida comparten LRCLK/BCLK (GPIO7/8); sin MCLK por el ESP.
i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true
  - id: i2s_input
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true

microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO43
    adc_type: external
    pdm: false
    sample_rate: 48000
    bits_per_sample: 32bit
    i2s_mode: secondary
    i2s_audio_id: i2s_input
    channel: stereo

speaker:
  # Salida física al hardware (vía DAC AIC3104).
  - platform: i2s_audio
    id: i2s_audio_speaker
    i2s_dout_pin: GPIO44
    i2s_audio_id: i2s_output
    sample_rate: 48000
    bits_per_sample: 32bit
    i2s_mode: secondary
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 100ms
    audio_dac: aic3104_dac

  # Mezcla media + announcement en una sola salida.
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  # Resamplean cada pipeline al formato del mixer.
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

media_player:
  - platform: speaker
    id: ambrosio_media
    name: "Ambrosio Media"
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1

# ── Wake word "oye ambrosio" (modelo local), leyendo el mic 48k vía el fork ──
micro_wake_word:
  id: mww
  microphone:
    microphone: i2s_mics
    channels: 1
  # Se para al detectar; el audio_streamer toma el micro y, al acabar el stream
  # (silencio/error), rearma micro_wake_word desde su on_end/on_error.
  stop_after_detection: true
  vad:
    model: github://esphome/micro-wake-word-models/models/v2/vad.json@main
    probability_cutoff: 80%
    sliding_window_size: 5
  models:
    # OJO: cargar un segundo modelo a la vez hace que oye_ambrosio deje de
    # dispararse (memoria/arena). Mantener SOLO este.
    - model: ./oye_pepe.json
      id: oye_pepe
      probability_cutoff: 75%
      sliding_window_size: 3
  on_wake_word_detected:
    then:
      - logger.log:
          format: "WAKEWORD DETECTADA: %s"
          args: [wake_word.c_str()]
      - lambda: 'id(streaming_audio) = true; id(led_r) = 0; id(led_g) = 80; id(led_b) = 255;'  # azul: escuchando
      - script.execute: led_solid
      - audio_streamer.start: streamer
