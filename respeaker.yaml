esphome:
  name: ambrosio-despacho
  on_boot:
    priority: -100
    then:
      - delay: 500ms
      - lambda: |-
          uint8_t led_off[4] = {0x14, 0x0C, 0x01, 0x00};
          id(bus_a).write(0x2C, led_off, 4);
          id(streamer).set_name(id(satellite_name).state);
      - micro_wake_word.start:

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_SPIRAM_SUPPORT: "y"
      CONFIG_SPIRAM_MODE_OCT: "y"
      CONFIG_SPIRAM_SPEED_80M: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s
  services:
    - service: set_led_color
      variables:
        red: int
        green: int
        blue: int
      then:
        - script.stop: led_heartbeat
        - lambda: |-
            uint8_t set_effect[4] = {0x14, 0x0C, 0x01, 0x03};
            id(bus_a).write(0x2C, set_effect, 4);
            uint8_t set_bright[4] = {0x14, 0x0D, 0x01, 0xFF};
            id(bus_a).write(0x2C, set_bright, 4);
            uint8_t r = (uint8_t) std::min(std::max((int) red,   0), 255);
            uint8_t g = (uint8_t) std::min(std::max((int) green, 0), 255);
            uint8_t b = (uint8_t) std::min(std::max((int) blue,  0), 255);
            uint8_t cmd[7] = {0x14, 0x10, 0x04, b, g, r, 0x00};
            id(bus_a).write(0x2C, cmd, 7);
    - service: leds_off
      then:
        - script.stop: led_heartbeat
        - script.execute: led_off
    - service: blink_color
      variables:
        red: int
        green: int
        blue: int
        count: int
      then:
        - script.stop: led_heartbeat
        - lambda: |-
            id(blink_r) = red;
            id(blink_g) = green;
            id(blink_b) = blue;
            id(blink_count) = (count > 0) ? count : 2;
        - script.execute: led_blink

globals:
  - id: pulse_idx
    type: int
    restore_value: no
    initial_value: '0'
  - id: blink_r
    type: int
    restore_value: no
    initial_value: '0'
  - id: blink_g
    type: int
    restore_value: no
    initial_value: '0'
  - id: blink_b
    type: int
    restore_value: no
    initial_value: '0'
  - id: blink_count
    type: int
    restore_value: no
    initial_value: '2'

script:
  - id: led_heartbeat
    mode: restart
    then:
      # Setup: efecto 3 = single color (sin animación XMOS), brillo al máximo, color a 0
      - lambda: |-
          id(pulse_idx) = 0;
          uint8_t set_effect[4] = {0x14, 0x0C, 0x01, 0x03};
          id(bus_a).write(0x2C, set_effect, 4);
          uint8_t set_bright[4] = {0x14, 0x0D, 0x01, 0xFF};
          id(bus_a).write(0x2C, set_bright, 4);
          uint8_t off_color[7] = {0x14, 0x10, 0x04, 0x00, 0x00, 0x00, 0x00};
          id(bus_a).write(0x2C, off_color, 7);
      # Fase 1: fade-in 0 → color completo en 2s (ease-out)
      - repeat:
          count: 75
          then:
            - lambda: |-
                const int fade_steps = 75;
                float t = (float)(id(pulse_idx) + 1) / fade_steps;
                float eased = 1.0f - (1.0f - t) * (1.0f - t);
                uint8_t r = 0;
                uint8_t g = (uint8_t)(128.0f * eased);
                uint8_t b = (uint8_t)(255.0f * eased);
                uint8_t cmd[7] = {0x14, 0x10, 0x04, b, g, r, 0x00};
                id(bus_a).write(0x2C, cmd, 7);
                id(pulse_idx)++;
            - delay: 20ms
      - lambda: 'id(pulse_idx) = 0;'
      # Fase 2: respiración escalando el color (50% ↔ 80%), ciclo 4s, empieza en máximo
      - while:
          condition:
            lambda: 'return true;'
          then:
            - lambda: |-
                const int period_steps = 150;       // 150 * 20ms = 3s
                const float min_scale = 0.5f;
                const float max_scale = 0.8f;
                float t = (float)(id(pulse_idx) % period_steps) / period_steps;
                float wave = (1.0f + std::cos(2.0f * 3.14159265f * t)) * 0.5f;
                float scale = min_scale + wave * (max_scale - min_scale);
                uint8_t r = 0;
                uint8_t g = (uint8_t)(128.0f * scale);
                uint8_t b = (uint8_t)(255.0f * scale);
                uint8_t cmd[7] = {0x14, 0x10, 0x04, b, g, r, 0x00};
                id(bus_a).write(0x2C, cmd, 7);
                id(pulse_idx)++;
            - delay: 20ms

  - id: led_off
    then:
      - lambda: |-
          uint8_t led_off_cmd[4] = {0x14, 0x0C, 0x01, 0x00};
          id(bus_a).write(0x2C, led_off_cmd, 4);

  # Parpadea N veces con el color indicado en los globals (blink_r/g/b, blink_count).
  # Al terminar deja los LEDs apagados.
  - id: led_blink
    mode: restart
    then:
      - lambda: |-
          uint8_t set_effect[4] = {0x14, 0x0C, 0x01, 0x03};
          id(bus_a).write(0x2C, set_effect, 4);
          uint8_t set_bright[4] = {0x14, 0x0D, 0x01, 0xFF};
          id(bus_a).write(0x2C, set_bright, 4);
      - repeat:
          count: !lambda 'return id(blink_count);'
          then:
            - lambda: |-
                uint8_t r = (uint8_t) std::min(std::max(id(blink_r), 0), 255);
                uint8_t g = (uint8_t) std::min(std::max(id(blink_g), 0), 255);
                uint8_t b = (uint8_t) std::min(std::max(id(blink_b), 0), 255);
                uint8_t cmd[7] = {0x14, 0x10, 0x04, b, g, r, 0x00};
                id(bus_a).write(0x2C, cmd, 7);
            - delay: 250ms
            - lambda: |-
                uint8_t off_color[7] = {0x14, 0x10, 0x04, 0, 0, 0, 0x00};
                id(bus_a).write(0x2C, off_color, 7);
            - delay: 200ms
      - script.execute: led_off

external_components:
  - source:
      type: local
      path: components
    components: [audio_streamer]

audio_streamer:
  id: streamer
  microphone: mic_respeaker
  host: !secret ambrosierver_host
  port: 9000
  silence_threshold: 300
  silence_duration: 1500ms
  min_duration: 500ms
  max_duration: 4s
  on_start:
    - logger.log: "STREAM: started"
  on_end:
    - logger.log: "STREAM: ended (silence)"
    - script.stop: led_heartbeat
    - script.execute: led_off
    - micro_wake_word.start:
  on_error:
    - logger.log: "STREAM: error"
    - script.stop: led_heartbeat
    - lambda: |-
        id(blink_r) = 220;
        id(blink_g) = 0;
        id(blink_b) = 0;
        id(blink_count) = 2;
    - script.execute: led_blink
    - micro_wake_word.start:

i2c:
  - id: bus_a
    sda: GPIO5
    scl: GPIO6
    scan: true

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: !secret wifi_ap_ssid
    password: !secret wifi_ap_password

captive_portal:

web_server:
  port: 80
  version: 3

text:
  - platform: template
    name: "Nombre del Ambrosio"
    id: satellite_name
    optimistic: true
    min_length: 1
    max_length: 32
    mode: text
    initial_value: "respeaker-1"
    restore_value: true
    on_value:
      then:
        - lambda: 'id(streamer).set_name(x);'

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO7
    i2s_bclk_pin: GPIO8

microphone:
  - platform: i2s_audio
    id: mic_respeaker
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO43
    adc_type: external
    pdm: false
    channel: right
    bits_per_sample: 32bit
    sample_rate: 16000

micro_wake_word:
  id: mww
  stop_after_detection: true

  microphone:
    microphone: mic_respeaker
    channels: 0

  models:
    - model: ./oye_ambrosio.json
      id: oye_ambrosio
      probability_cutoff: 95%
      sliding_window_size: 5

  on_wake_word_detected:
    then:
      - logger.log:
          format: "WAKEWORD DETECTADA: %s"
          args: [wake_word.c_str()]
      - script.execute: led_heartbeat
      - audio_streamer.start: streamer